<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch họp công ty</title>
</head>
<body>
    <h1>Lịch họp công ty</h1>

    <table border="1">
        <tr>
            <th>Ngày</th>
            <th>Giờ</th>
            <th>Nội dung cuộc họp</th>
        </tr>
        <tr>
            <td rowspan="2">Thứ Hai</td>
            <td>08:00 - 09:00</td>
            <td>Họp giao ban đầu tuần</td>
        </tr>
        <tr>
            <td>14:00 - 15:00</td>
            <td>Họp phòng Kinh doanh</td>
        </tr>
        <tr>
            <td>Thứ Ba</td>
            <td colspan="2">09:00 - 11:00: Họp triển khai dự án mới</td>
        </tr>
        <tr>
            <td rowspan="2">Thứ Tư</td>
            <td>10:00 - 11:00</td>
            <td>Họp phòng Kỹ thuật</td>
        </tr>
        <tr>
            <td>15:00 - 16:00</td>
            <td>Họp đánh giá tiến độ</td>
        </tr>
    </table>
</body>
</html>
