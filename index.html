<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS grid-row Property</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Thực hành CSS grid-row</h1>

    <section>
        <h2>Ví dụ 1: grid-row: 1 / 3</h2>
        <div class="grid-container example-one">
            <div class="item item1">Ô 1</div>
            <div class="item">Ô 2</div>
            <div class="item">Ô 3</div>
            <div class="item">Ô 4</div>
            <div class="item">Ô 5</div>
            <div class="item">Ô 6</div>
        </div>
    </section>

    <section>
        <h2>Ví dụ 2: grid-row: 2 / 4</h2>
        <div class="grid-container example-two">
            <div class="item item1">Ô 1</div>
            <div class="item">Ô 2</div>
            <div class="item">Ô 3</div>
            <div class="item">Ô 4</div>
            <div class="item">Ô 5</div>
            <div class="item">Ô 6</div>
        </div>
    </section>

    <section>
        <h2>Ví dụ 3: grid-row: span 2</h2>
        <div class="grid-container example-three">
            <div class="item item1">Ô 1</div>
            <div class="item">Ô 2</div>
            <div class="item">Ô 3</div>
            <div class="item">Ô 4</div>
            <div class="item">Ô 5</div>
            <div class="item">Ô 6</div>
        </div>
    </section>
</body>
</html>
