<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS flex-flow Property</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Thực hành CSS flex-flow</h1>

    <section>
        <h2>Ví dụ 1: flex-flow: row nowrap</h2>
        <div class="container container-1">
            <div>1</div>
            <div>2</div>
            <div>3</div>
        </div>
        <p>Các item được sắp xếp từ trái sang phải trên cùng một hàng và không xuống dòng.</p>
    </section>

    <section>
        <h2>Ví dụ 2: flex-flow: row-reverse nowrap</h2>
        <div class="container container-2">
            <div>1</div>
            <div>2</div>
            <div>3</div>
        </div>
        <p>Các item vẫn nằm trên một hàng nhưng thứ tự hiển thị bị đảo theo chiều từ phải sang trái.</p>
    </section>
</body>
</html>
