<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS grid-gap Property</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Thực hành CSS grid-gap</h1>

    <section>
        <h2>Ví dụ 1: grid-gap: 20px</h2>
        <div class="grid-container example-one">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
        </div>
        <p>Khoảng cách giữa cả hàng và cột đều là 20px.</p>
    </section>

    <section>
        <h2>Ví dụ 2: grid-gap: 30px 10px</h2>
        <div class="grid-container example-two">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
            <div>Ô 5</div>
            <div>Ô 6</div>
        </div>
        <p>Khoảng cách giữa hàng là 30px, giữa cột là 10px.</p>
    </section>
</body>
</html>
