<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Responsive Image Gallery</h1>
        <p class="subtitle">Thay đổi kích thước cửa sổ trình duyệt để xem hiệu ứng responsive.</p>

        <div class="gallery-row">
            <div class="responsive">
                <div class="gallery">
                    <a target="_blank" href="https://www.w3schools.com/css/img_5terre.jpg">
                        <img src="https://www.w3schools.com/css/img_5terre.jpg" alt="Cinque Terre">
                    </a>
                    <div class="desc">Phong cảnh Cinque Terre</div>
                </div>
            </div>

            <div class="responsive">
                <div class="gallery">
                    <a target="_blank" href="https://www.w3schools.com/css/img_forest.jpg">
                        <img src="https://www.w3schools.com/css/img_forest.jpg" alt="Forest">
                    </a>
                    <div class="desc">Khu rừng xanh</div>
                </div>
            </div>

            <div class="responsive">
                <div class="gallery">
                    <a target="_blank" href="https://www.w3schools.com/css/img_lights.jpg">
                        <img src="https://www.w3schools.com/css/img_lights.jpg" alt="Northern Lights">
                    </a>
                    <div class="desc">Bắc cực quang</div>
                </div>
            </div>

            <div class="responsive">
                <div class="gallery">
                    <a target="_blank" href="https://www.w3schools.com/css/img_mountains.jpg">
                        <img src="https://www.w3schools.com/css/img_mountains.jpg" alt="Mountains">
                    </a>
                    <div class="desc">Dãy núi hùng vĩ</div>
                </div>
            </div>
        </div>

        <div class="clearfix"></div>

        <div class="note">
            <p><strong>Trên 700px:</strong> 4 ảnh trên một dòng.</p>
            <p><strong>Dưới 700px:</strong> 2 ảnh trên một dòng.</p>
            <p><strong>Dưới 500px:</strong> 1 ảnh trên một dòng.</p>
        </div>
    </div>
</body>
</html>
