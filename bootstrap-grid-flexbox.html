<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Grid và Flexbox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4"><i class="fas fa-table-columns"></i> Bố cục 3 cột bằng Bootstrap</h1>

        <div class="row g-3">
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-light p-3 border rounded">
                <p class="mb-0">Phần 1</p>
            </div>
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-secondary p-3 text-white border rounded">
                <p class="mb-0">Phần 2</p>
            </div>
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-light p-3 border rounded">
                <p class="mb-0">Phần 3</p>
            </div>
        </div>
    </div>

    <div class="container my-5 py-3 bg-body-tertiary rounded">
        <h3 class="text-center mb-0">Khoảng cách được điều chỉnh bằng Margin & Padding</h3>
    </div>

    <div class="container">
        <div class="d-none d-md-block bg-warning text-center p-3 rounded">
            <p class="mb-0">Nội dung này chỉ hiển thị trên màn hình lớn hơn hoặc bằng 768px</p>
        </div>
    </div>

    <div class="container mt-5">
        <h3 class="mb-3"><i class="fas fa-images"></i> Carousel</h3>
        <div id="myCarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
            </div>
            <div class="carousel-inner rounded overflow-hidden">
                <div class="carousel-item active">
                    <img src="https://picsum.photos/seed/bootstrap1/1200/420" class="d-block w-100" alt="Hình ảnh 1">
                </div>
                <div class="carousel-item">
                    <img src="https://picsum.photos/seed/bootstrap2/1200/420" class="d-block w-100" alt="Hình ảnh 2">
                </div>
                <div class="carousel-item">
                    <img src="https://picsum.photos/seed/bootstrap3/1200/420" class="d-block w-100" alt="Hình ảnh 3">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Trước</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Tiếp</span>
            </button>
        </div>
    </div>

    <div class="container my-5">
        <h3><i class="fas fa-home"></i> Trang chủ</h3>
        <p>Ví dụ sử dụng Font Awesome cùng các thành phần Bootstrap.</p>
    </div>

    <form class="container mb-5">
        <h3 class="mb-4"><i class="fas fa-envelope"></i> Biểu mẫu liên hệ</h3>
        <div class="mb-3">
            <label for="name" class="form-label">Họ và tên</label>
            <input type="text" class="form-control" id="name" placeholder="Nhập họ và tên">
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="Nhập email">
        </div>
        <div class="mb-3">
            <label for="message" class="form-label">Nội dung</label>
            <textarea class="form-control" id="message" rows="4" placeholder="Nhập nội dung"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-paper-plane"></i> Gửi
        </button>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
